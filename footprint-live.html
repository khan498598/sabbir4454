<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Footprint Live</title><style>:root{color-scheme:dark;--bg:#071018;--panel:#0e1b26;--line:#203442;--text:#e7f0f4;--muted:#8ea5b1;--teal:#48d6c4;--green:#65d98b;--red:#f27b83}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#071018,#0c1921);color:var(--text);font:14px/1.4 Segoe UI,sans-serif}.shell{max-width:1280px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px}.eyebrow{color:var(--teal);font:700 11px ui-monospace,Consolas,monospace}.head h1{margin:8px 0}.market{text-align:right}.market strong{display:block;font:700 22px Consolas}.muted{color:var(--muted)}.status{color:var(--teal);margin-top:6px}.status.bad{color:var(--red)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;margin-top:16px}.panel{border:1px solid var(--line);background:rgba(14,27,38,.9);padding:14px}.canvas{height:560px}.canvas canvas{width:100%;height:100%;display:block}.rows{display:grid;gap:5px;max-height:510px;overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:5px 7px;font:12px Consolas}.buy{background:rgba(101,217,139,.18);color:var(--green)}.sell{background:rgba(242,123,131,.18);color:var(--red)}button{border:1px solid var(--line);background:#132532;color:var(--text);padding:7px 10px;cursor:pointer}@media(max-width:800px){.shell{padding:14px}.head{display:block}.market{text-align:left;margin-top:12px}.layout{grid-template-columns:1fr}.canvas{height:400px}}</style></head><body><main class="shell"><header class="head"><div><div class="eyebrow">PRIME TOOLS / FOOTPRINT</div><h1>Footprint Live</h1><div class="status" id="status">Loading Binance candles...</div></div><div class="market"><strong id="symbol">BTCUSDT</strong><span class="muted" id="meta">BINANCE · 5m</span></div></header><div class="layout"><section class="panel"><div><button data-tf="1m">1m</button> <button data-tf="5m">5m</button> <button data-tf="15m">15m</button> <button id="reload">Reconnect</button></div><div class="canvas"><canvas id="chart"></canvas></div></section><aside class="panel"><h2>Latest footprint</h2><div id="rows" class="rows"></div><p class="muted" id="note">Buy/sell is estimated from Binance taker buy volume when available.</p></aside></div></main><script>(function(){'use strict';var p=new URLSearchParams(location.search),symbol=(p.get('symbol')||'BTCUSDT').replace(/[^A-Za-z0-9]/g,'').toUpperCase(),exchange=(p.get('exchange')||'binance').toLowerCase(),tf=p.get('tf')||p.get('timeframe')||'5m',rows=[],$=function(id){return document.getElementById(id)};var bootstrap;try{bootstrap=JSON.parse(localStorage.getItem('guardeer_prime_footprint_bootstrap_v1')||'null')}catch(_){bootstrap=null}if(!p.get('symbol')&&bootstrap&&bootstrap.symbol)symbol=bootstrap.symbol;if(!p.get('exchange')&&bootstrap&&bootstrap.exchange)exchange=bootstrap.exchange;if(!p.get('tf')&&!p.get('timeframe')&&bootstrap&&bootstrap.timeframe)tf=bootstrap.timeframe;$('symbol').textContent=symbol;$('meta').textContent=exchange.toUpperCase()+' · '+tf;function crypto(){return exchange==='binance'&&/(USDT|USDC|BUSD)$/.test(symbol)}function url(){return 'https://api.binance.com/api/v3/klines?symbol='+encodeURIComponent(symbol)+'&interval='+encodeURIComponent(tf)+'&limit=90'}function status(t,bad){$('status').textContent=t;$('status').className='status'+(bad?' bad':'')}function load(){if(!crypto()){rows=[];draw();status('CRYPTO ONLY · Binance route required',true);$('note').textContent='This standalone page does not add Forex/XAUUSD Level 2. Select a Binance USDT/USDC market.';return}status('Loading Binance candles...');fetch(url(),{cache:'no-store'}).then(function(r){if(!r.ok)throw Error(r.status);return r.json()}).then(function(data){rows=data.map(function(r){return{time:+r[0],open:+r[1],high:+r[2],low:+r[3],close:+r[4],volume:+r[5],buy:+r[9]}});draw();status('LIVE · BINANCE');renderRows()}).catch(function(){status('Binance feed unavailable',true)})}function renderRows(){var recent=rows.slice(-12).reverse();$('rows').innerHTML=recent.map(function(r){var buy=r.buy||0,sell=Math.max(0,r.volume-buy),cls=buy>=sell?'buy':'sell';return '<div class="row '+cls+'"><span>'+new Date(r.time).toLocaleTimeString()+'</span><span>B '+buy.toFixed(2)+'</span><span>S '+sell.toFixed(2)+'</span></div>'}).join('')}function draw(){var c=$('chart'),box=c.parentElement,w=box.clientWidth,h=box.clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;var x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);if(!rows.length){x.fillStyle='#8ea5b1';x.fillText('No crypto footprint data',18,28);return}var lo=Math.min.apply(null,rows.map(function(r){return r.low})),hi=Math.max.apply(null,rows.map(function(r){return r.high})),pad=(hi-lo)*.08||1;lo-=pad;hi+=pad;var y=function(v){return h-(v-lo)/(hi-lo)*h},step=w/rows.length;rows.forEach(function(r,i){var xx=i*step+step/2,up=r.close>=r.open;x.strokeStyle=up?'#65d98b':'#f27b83';x.fillStyle=x.strokeStyle;x.beginPath();x.moveTo(xx,y(r.high));x.lineTo(xx,y(r.low));x.stroke();var top=y(Math.max(r.open,r.close)),bottom=y(Math.min(r.open,r.close));x.fillRect(xx-step*.3,top,step*.6,Math.max(1,bottom-top));x.fillStyle='#8ea5b1';x.font='10px Consolas';x.fillText((r.buy||0).toFixed(0),Math.max(0,xx-12),Math.max(12,y(r.low)-5))})}document.querySelectorAll('[data-tf]').forEach(function(b){b.onclick=function(){tf=b.getAttribute('data-tf');$('meta').textContent=exchange.toUpperCase()+' · '+tf;load()}});$('reload').onclick=load;window.addEventListener('resize',draw);load();})();</script></body></html>
